<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>O2 Figure Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: three-pane studio — icon library | white artboard on a stage | inspector. Palette borrows H&E stain: eosin pink accent, hematoxylin violet neutrals. */
:root{
  --bg:#f3f1f7; --panel:#ffffff; --ink:#231d33; --muted:#6c6582; --line:#e1dcea; --hover:#f1edf8;
  --accent:#c8366e; --accent-soft:#fbe6ee; --accent-ink:#ffffff; --hema:#4b3f8f; --stage:#e7e3ee; --o2:#06bdfe; --o2-o:#15131c; --shadow:rgba(35,29,51,.14);
  --f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16131d; --panel:#1f1b29; --ink:#ece8f4; --muted:#a49eb7; --line:#332d42; --hover:#2a2537;
  --accent:#ef6a9b; --accent-soft:#3a2130; --accent-ink:#1a0f15; --hema:#a596ef; --stage:#100e15; --o2:#06bdfe; --o2-o:#ffffff; --shadow:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16131d; --panel:#1f1b29; --ink:#ece8f4; --muted:#a49eb7; --line:#332d42; --hover:#2a2537;
  --accent:#ef6a9b; --accent-soft:#3a2130; --accent-ink:#1a0f15; --hema:#a596ef; --stage:#100e15; --o2:#06bdfe; --o2-o:#ffffff; --shadow:rgba(0,0,0,.5); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:248px minmax(0,1fr) 272px;grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"top top top" "lib stage insp" "foot foot foot"}
.top{grid-area:top;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:8px;margin-right:6px}
.brand b{font-family:var(--f-display);font-size:18px;letter-spacing:-.01em;white-space:nowrap}
.brand b span{color:var(--accent)}
.o2{font-family:"Orbitron","Bricolage Grotesque",system-ui,sans-serif;font-weight:900;font-size:20px;letter-spacing:.04em;line-height:1}
.o2-o{color:var(--o2-o)}.o2-2{color:var(--o2)}
.grp{display:flex;align-items:center;gap:2px;padding:2px;border:1px solid var(--line);border-radius:9px}
.tb{display:inline-flex;align-items:center;gap:6px;height:32px;min-width:32px;justify-content:center;padding:0 8px;border:0;background:transparent;border-radius:7px;font-weight:500}
.tb:hover{background:var(--hover)}
.tb[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.tb svg{width:17px;height:17px;flex:none}
.tb:disabled{opacity:.35;cursor:default;background:transparent}
.zoom{font-family:var(--f-mono);font-size:12px;min-width:48px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.spacer{flex:1}
.primary{background:var(--accent);color:var(--accent-ink);font-weight:600;padding:0 12px}
.primary:hover{background:var(--accent);filter:brightness(1.07)}
.pop{position:absolute;top:calc(100% + 6px);right:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px var(--shadow);padding:8px;display:grid;gap:2px;min-width:230px;z-index:20}
.pop .tb{justify-content:flex-start;width:100%;height:auto;padding:8px 10px;text-align:left;flex-direction:column;align-items:flex-start;gap:1px}
.pop .tb small{color:var(--muted);font-weight:400;font-size:12px}
.pop .row{display:flex;gap:6px;align-items:center;padding:6px 10px;color:var(--muted);font-size:12px}
.pop select{padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.confirm{display:flex;gap:8px;align-items:center;padding:6px 10px}

/* library */
.lib{grid-area:lib;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.lib-head{padding:12px 14px 8px;display:grid;gap:8px}
.lib-head h2,.insp h2{font-family:var(--f-display);font-size:15px;margin:0;letter-spacing:-.005em}
.search{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.lib-body{overflow:auto;padding:0 10px 16px;min-height:0}
.cat{margin:12px 4px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.item{border:1px solid transparent;background:transparent;border-radius:10px;padding:6px 2px 5px;display:grid;justify-items:center;gap:3px;min-width:0}
.item:hover{background:var(--hover);border-color:var(--line)}
.item svg{width:48px;height:48px}
.item span{font-size:11px;line-height:1.2;color:var(--muted);text-align:center;overflow-wrap:anywhere}
.empty-lib{color:var(--muted);padding:12px 4px;font-size:13px}

/* stage */
.stage{grid-area:stage;background:var(--stage);overflow:auto;display:flex;padding:24px;min-height:0;position:relative}
#svg{margin:auto;flex:none;background:#fff;box-shadow:0 1px 2px var(--shadow),0 10px 40px var(--shadow);touch-action:none;display:block;user-select:none;-webkit-user-select:none}
#svg.transparent{background:repeating-conic-gradient(#e8e8ee 0 25%,#fff 0 50%) 0 0/20px 20px}
#svg.tool-arrow,#svg.tool-text,#svg.tool-brush{cursor:crosshair}
.item.on{background:var(--accent-soft);border-color:var(--accent)}
.item.on span{color:var(--accent);font-weight:600}
#svg [data-id]{cursor:move}
.ov-box{fill:none;stroke:var(--accent);stroke-dasharray:5 4}
.ov-line{stroke:var(--accent)}
.hd{fill:var(--panel);stroke:var(--accent);cursor:pointer}
.hd.res{cursor:nwse-resize}.hd.rot{cursor:grab}
.hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:var(--panel);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;pointer-events:none;white-space:nowrap}

/* inspector */
.insp{grid-area:insp;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:14px 16px 24px;min-height:0;display:grid;align-content:start;gap:14px}
.insp-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.kind{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.field{display:grid;gap:6px}
.lab{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sw{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.swatch{width:22px;height:22px;border-radius:6px;border:1px solid rgba(0,0,0,.12);padding:0}
.swatch.on{outline:2px solid var(--ink);outline-offset:1px}
input[type=color]{width:30px;height:24px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.num{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.num span{font-family:var(--f-mono);font-size:11px;color:var(--muted);padding:0 7px}
.num input{border:0;background:transparent;padding:6px 6px 6px 0;width:100%;min-width:0;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.insp textarea{width:100%;min-height:72px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);line-height:1.4}
.insp select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.range{display:flex;align-items:center;gap:8px}
.range input{flex:1;accent-color:var(--accent)}
.range output{font-family:var(--f-mono);font-size:12px;width:38px;text-align:right;color:var(--muted)}
.check{display:flex;align-items:center;gap:8px;font-size:13px}
.check input{accent-color:var(--accent);width:16px;height:16px}
.btnrow{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:500}
.btn:hover{background:var(--hover)}
.btn.danger{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:6px 4px;font-size:12px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.keys{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:12.5px;color:var(--muted);margin:0}
.keys kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--ink);background:var(--bg);white-space:nowrap}
.note{font-size:12.5px;color:var(--muted);line-height:1.45;margin:0}
hr.sep{border:0;border-top:1px solid var(--line);margin:0}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(15,12,22,.5);display:grid;place-items:center;padding:16px;z-index:50}
.sheet{background:var(--panel);border-radius:14px;max-width:min(720px,100%);width:100%;max-height:90%;overflow:auto;padding:18px;display:grid;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.sheet h3{margin:0;font-family:var(--f-display);font-size:17px}
.sheet img{max-width:100%;border:1px solid var(--line);border-radius:8px;background:repeating-conic-gradient(#ececf1 0 25%,#fff 0 50%) 0 0/16px 16px}
.sheet textarea{width:100%;height:220px;font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg)}
.tb.ai{color:var(--hema);font-weight:600;background:color-mix(in srgb,var(--hema) 10%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 11px;font-size:12.5px;text-align:left}
.chip:hover{border-color:var(--hema)}
.status{font-size:13px;color:var(--hema);min-height:1.4em;font-variant-numeric:tabular-nums}
.btn.primary-btn{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn:disabled,.seg button:disabled{opacity:.5;cursor:default}
.sheet #aiprompt{height:96px;font-family:var(--f-ui);font-size:14px;line-height:1.45}
.gen{display:grid;gap:6px;padding:10px;border-radius:10px;background:color-mix(in srgb,var(--hema) 8%,var(--panel));border:1px solid color-mix(in srgb,var(--hema) 22%,var(--line))}
.gen-lab{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--hema)}
.gen-lab svg{width:15px;height:15px}
.gen-row{display:flex;gap:6px}
.gen-row input{flex:1;min-width:0;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.gen-row button{border:0;border-radius:8px;padding:0 11px;background:var(--hema);color:var(--panel);font-weight:600;font-size:13px}
.gen-status{font-size:12px;color:var(--muted);line-height:1.35}
.gen-status:empty{display:none}
.gen-status.err{color:var(--accent)}
.foot{grid-area:foot;text-align:center;padding:7px 16px calc(7px + env(safe-area-inset-bottom,0px));font-size:11px;letter-spacing:.04em;color:var(--muted);background:var(--panel);border-top:1px solid var(--line)}
.footer-link{position:relative;display:inline-block;color:var(--muted);text-decoration:none;font-weight:500;padding-bottom:2px;transition:color .25s ease,letter-spacing .25s ease}
.footer-link::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:1.5px;background:linear-gradient(90deg,var(--o2),var(--accent));transform:scaleX(0);transform-origin:right center;transition:transform .32s cubic-bezier(.65,0,.35,1)}
.footer-link:hover,.footer-link:focus-visible{color:var(--o2);letter-spacing:.07em}
.footer-link:hover::after,.footer-link:focus-visible::after{transform:scaleX(1);transform-origin:left center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:999px;font-size:13px;z-index:60;box-shadow:0 8px 24px var(--shadow)}

@media (max-width:900px){
  html,body{height:auto}
  .app{display:flex;flex-direction:column;height:auto}
  .top{position:sticky;top:env(safe-area-inset-top,0px);padding:8px 12px}
  .brand b{font-size:16px}
  .stage{height:56vh;padding:14px}
  .lib{border-right:0;border-top:1px solid var(--line)}
  .lib-body{max-height:300px}
  .items{grid-template-columns:repeat(auto-fill,minmax(72px,1fr))}
  .insp{border-left:0;border-top:1px solid var(--line);padding-inline:16px}
  .hint{display:none}
  .pop{right:12px;left:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <span class="o2" aria-label="O2"><span class="o2-o">O</span><span class="o2-2">2</span></span>
      <b>Figure Studio</b>
    </div>
    <div class="grp" role="group" aria-label="Tools">
      <button class="tb" id="t-select" data-tool="select" title="Select and move (V)" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 3l14 8-6 1.5L10 19z"/></svg></button>
      <button class="tb" id="t-arrow" data-tool="arrow" title="Draw arrow (A)" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20L19 5M11 5h8v8"/></svg></button>
      <button class="tb" id="t-brush" data-tool="brush" title="Brush (B)" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 3L10 13"/><path d="M10 13c-3 0-5 2-5 4.5S3 21 3 21s5 .5 7-1.5 2-4.5 0-6.5z"/></svg></button>
      <button class="tb" id="t-text" data-tool="text" title="Add text (T)" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg></button>
    </div>
    <div class="grp">
      <button class="tb" id="undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
      <button class="tb" id="redo" title="Redo (Ctrl+Shift+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button>
    </div>
    <div class="grp">
      <button class="tb" id="zout" title="Zoom out">−</button>
      <span class="zoom" id="zlabel">100%</span>
      <button class="tb" id="zin" title="Zoom in">+</button>
      <button class="tb" id="zfit" title="Fit to window">Fit</button>
    </div>
    <div class="spacer"></div>
    <button class="tb" id="addimg" title="Place a micrograph or photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>Image</button>
    <button class="tb" id="newbtn">New</button>
    <button class="tb" id="filebtn">Project</button>
    <button class="tb primary" id="exportbtn">Export</button>
    <div class="pop" id="exportpop" hidden>
      <button class="tb" data-export="png">PNG image<small>For slides and posters</small></button>
      <div class="row">Scale <select id="pngscale"><option value="1">1×</option><option value="2">2×</option><option value="3" selected>3×</option><option value="4">4×</option></select> <span id="pngpx"></span></div>
      <button class="tb" data-export="svg">SVG vector<small>Editable in Illustrator or Inkscape</small></button>
    </div>
    <div class="pop" id="filepop" hidden>
      <button class="tb" id="savejson">Save project<small>.json you can reopen here later</small></button>
      <button class="tb" id="openjson">Open project<small>Load a saved .json</small></button>
      <button class="tb" id="loadsample">Load example figure<small>Bioprinting workflow</small></button>
    </div>
    <div class="pop" id="newpop" hidden>
      <div class="confirm"><span>Clear the canvas?</span></div>
      <div class="confirm"><button class="btn danger" id="newyes">Clear canvas</button><button class="btn" id="newno">Cancel</button></div>
      <p class="note" style="padding:0 10px 6px">Undo brings it back.</p>
    </div>
    <input type="file" id="imgfile" accept="image/*" hidden>
    <input type="file" id="jsonfile" accept=".json,application/json" hidden>
  </header>

  <aside class="lib" aria-label="Icon library">
    <div class="lib-head">
      <h2>Library</h2>
      <div class="gen" id="genbox" hidden>
        <label class="gen-lab" for="genin"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11 2l1.9 5.6L18.5 9.5l-5.6 1.9L11 17l-1.9-5.6L3.5 9.5l5.6-1.9z"/><path d="M19 13l.9 2.6 2.6.9-2.6.9L19 20l-.9-2.6-2.6-.9 2.6-.9z"/></svg>Generate an icon</label>
        <div class="gen-row"><input id="genin" type="text" placeholder="e.g. peristaltic pump" autocomplete="off"><button id="gengo">Generate</button></div>
        <div class="gen-status" id="genstatus" aria-live="polite"></div>
      </div>
      <input class="search" id="search" type="search" placeholder="Search icons — iPSC, nozzle, organoid…" autocomplete="off">
    </div>
    <div class="lib-body" id="libbody"></div>
  </aside>

  <main class="stage" id="stage">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg">
      <g id="bggrid"></g>
      <g id="content"></g>
      <g id="overlay"></g>
    </svg>
    <div class="hint" id="hint">Click an icon to add it, or drag it onto the canvas</div>
  </main>

  <aside class="insp" id="insp" aria-label="Inspector"></aside>
  <footer class="foot">2026 &nbsp;·&nbsp;<a class="footer-link" href="https://o23r.com" target="_blank" rel="noopener">Made by Ozer</a></footer>
</div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const f=n=>+(+n).toFixed(1);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const clone=o=>JSON.parse(JSON.stringify(o));
function shade(hex,t){let c=String(hex).replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');const n=parseInt(c,16)||0;const ch=[n>>16,n>>8&255,n&255].map(v=>Math.round(t<0?v*(1+t):v+(255-v)*t));return '#'+ch.map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')).join('')}
const D=c=>shade(c,-.38), L=c=>shade(c,.62);
const GL=(x,y,rx,ry,r=-35)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="#fff" opacity=".5" transform="rotate(${r} ${x} ${y})"/>`;
const STEEL='#9aa0b0', GLASS_ST='#7f8698';
const FIG_FONT='Helvetica, Arial, sans-serif';
const SW=['#231d33','#6b7280','#ffffff','#e8618c','#c8366e','#f6a5c0','#7c5cbf','#4b3f8f','#3a86c8','#5fb7d4','#2bb3a3','#7cc36b','#f2a541','#e4573d','#d9474b'];

function smoothPts(pts){
  if(pts.length<3) return pts.map(p=>[p[0],p[1]]);

}
function resample(pts,step){

    case 'beads':{let s='';resample(o.pts,w*.9).forEach((p,i)=>{const c=i%4===3?b:a;s+=`<circle cx="${f(p.x)}" cy="${f(p.y)}" r="${f(w*.5)}" fill="${c}" stroke="${D(c)}" stroke-width="1.2"/>`});return s}

const check=(label,prop,val)=>`<label class="check"><input type="checkbox" id="p-${prop}" data-prop="${prop}" data-bool${val?' checked':''}>${label}</label>`;
const seg=(prop,val,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button data-seg="${prop}" data-val="${v}" aria-pressed="${v==val}">${l}</button>`).join('')}</div>`;
const arrangeRow=`<div class="field"><span class="lab">Arrange</span><div class="btnrow"><button class="btn" data-act="front">To front</button><button class="btn" data-act="fwd">Forward</button><button class="btn" data-act="bwd">Backward</button><button class="btn" data-act="back">To back</button></div></div><div class="btnrow"><button class="btn" data-act="dup">Duplicate</button><button class="btn danger" data-act="del">Delete</button></div>`;
const geo=o=>`<div class="field"><span class="lab">Position & size</span><div class="grid2">${num('X','x',o.x)}${num('Y','y',o.y)}${num('W','w',o.w)}${num('H','h',o.h)}${num('°','rot',o.rot||0)}</div></div>`;

function renderInspector(){
  const o=sel&&get(sel), I=$('#insp');
  if(!o){
    const sizes=[['1200x740','Figure 1200 × 740'],['1600x900','Slide 16:9'],['1000x1000','Square'],['1123x794','A4 landscape'],['794x1123','A4 portrait'],['1500x600','Graphical abstract']];
    const cur=doc.w+'x'+doc.h;
    I.innerHTML=`<div class="insp-head"><h2>Canvas</h2><span class="kind">${doc.items.length} objects</span></div>
    <div class="field"><span class="lab">Artboard</span><select id="p-size">${sizes.map(([v,l])=>`<option value="${v}"${v===cur?' selected':''}>${l}</option>`).join('')}${sizes.some(s=>s[0]===cur)?'':`<option selected>${doc.w} × ${doc.h}</option>`}</select></div>
    <div class="field"><span class="lab">Background</span>${seg('bg',doc.bg==='transparent'?'transparent':'#ffffff',[['#ffffff','White'],['transparent','Transparent']])}</div>
    ${check('Snap to 10 px grid','snap',doc.snap)}
    <hr class="sep">
    <div class="field"><span class="lab">Shortcuts</span><dl class="keys"><dt><kbd>V</kbd> <kbd>A</kbd> <kbd>B</kbd> <kbd>T</kbd></dt><dd style="margin:0">Select, arrow, brush, text</dd><dt><kbd>Ctrl</kbd>+<kbd>D</kbd></dt><dd style="margin:0">Duplicate</dd><dt><kbd>Ctrl</kbd>+<kbd>Z</kbd></dt><dd style="margin:0">Undo</dd><dt><kbd>Shift</kbd>+drag</dt><dd style="margin:0">Snap rotation to 15°</dd><dt><kbd>←↑→↓</kbd></dt><dd style="margin:0">Nudge 1 px, Shift for 10</dd><dt><kbd>Del</kbd></dt><dd style="margin:0">Remove selected</dd></dl></div>
    <p class="note">Your figure saves in this browser as you work. Use Project → Save project to keep a copy you can reopen anywhere.</p>`;
    return;
  }
  let h='';
  if(o.type==='icon'){
    h=`<div class="insp-head"><h2>${esc(iconDef(o.icon)?.name||'Icon')}</h2><span class="kind">icon</span></div>${colorField('Main color','a',o.a)}${colorField('Detail color','b',o.b)}${range('Opacity','op',o.op??1,.1,1,.05,v=>Math.round(v*100)+'%')}${geo(o)}<div class="btnrow">${check('Lock ratio','lock',o.lock!==false)}${check('Flip horizontal','flip',o.flip)}</div><button class="btn" data-act="resetcol">Reset colors</button>${arrangeRow}`;
  } else if(o.type==='shape'){
    h=`<div class="insp-head"><h2>${o.kind==='ellipse'?'Ellipse':o.kind==='round'?'Panel':'Rectangle'}</h2><span class="kind">shape</span></div>${colorField('Fill','a',o.a)}${colorField('Outline','b',o.b)}${range('Outline width','sw',o.sw,0,12,.5,v=>v+' px')}${o.kind==='round'?range('Corner radius','r',o.r,0,80,1,v=>v+' px'):''}${check('Dashed outline','dash',o.dash)}${range('Opacity','op',o.op??1,.1,1,.05,v=>Math.round(v*100)+'%')}${geo(o)}${arrangeRow}`;
  } else if(o.type==='text'){
    h=`<div class="insp-head"><h2>Text</h2><span class="kind">label</span></div><div class="field"><label class="lab" for="p-text">Content</label><textarea id="p-text" data-prop="text">${esc(o.text)}</textarea></div><div class="grid2">${num('pt','size',o.size)}${num('°','rot',o.rot||0)}</div><div class="field"><span class="lab">Weight</span>${seg('weight',o.weight,[[400,'Regular'],[600,'Semibold'],[700,'Bold']])}</div><div class="field"><span class="lab">Align</span>${seg('anchor',o.anchor,[['start','Left'],['middle','Center'],['end','Right']])}</div>${colorField('Color','color',o.color)}${arrangeRow}`;
  } else if(o.type==='arrow'){
    h=`<div class="insp-head"><h2>Arrow</h2><span class="kind">connector</span></div>${colorField('Color','color',o.color)}${range('Line width','width',o.width,1,12,.5,v=>v+' px')}${range('Curve','curve',o.curve||0,-300,300,1,v=>v)}<div class="field"><span class="lab">Heads</span>${seg('head',o.head,[['none','None'],['end','End'],['both','Both']])}</div>${check('Dashed line','dash',o.dash)}<div class="btnrow"><button class="btn" data-act="reverse">Reverse direction</button></div><p class="note">Drag the middle dot to bend. Hold Shift on an end to keep it straight.</p>${arrangeRow}`;
  } else if(o.type==='brush'){
    h=`<div class="insp-head"><h2>${esc(BRUSHES[o.style]?.name||'Brush')}</h2><span class="kind">brush</span></div><div class="field"><label class="lab" for="p-style">Brush</label><select id="p-style" data-prop="style">${Object.entries(BRUSHES).map(([k,v])=>`<option value="${k}"${k===o.style?' selected':''}>${v.name}</option>`).join('')}</select></div>${colorField('Main color','a',o.a)}${o.style==='pen'||o.style==='dashed'?'':colorField('Detail color','b',o.b)}${range('Width','width',o.width,1,80,1,v=>v+' px')}${range('Opacity','op',o.op??1,.1,1,.05,v=>Math.round(v*100)+'%')}${arrangeRow}`;
  } else if(o.type==='image'){
    h=`<div class="insp-head"><h2>Image</h2><span class="kind">placed</span></div>${range('Opacity','op',o.op??1,.1,1,.05,v=>Math.round(v*100)+'%')}${geo(o)}<div class="btnrow">${check('Lock ratio','lock',o.lock!==false)}${check('Flip horizontal','flip',o.flip)}</div>${arrangeRow}`;
  }
  I.innerHTML=h;
}
function setProp(prop,val){
  const o=sel&&get(sel); if(!o) return;
  if(prop==='w'&&(o.type==='icon'||o.type==='image')&&o.lock!==false&&o.w){o.h=f(o.h*val/o.w)}
  if(prop==='h'&&(o.type==='icon'||o.type==='image')&&o.lock!==false&&o.h){o.w=f(o.w*val/o.h)}
  if(o.type==='arrow'&&prop==='color') lastArrowColor=val;
  if(o.type==='brush'){if(prop==='style'){const d=BRUSHES[val];o.a=d.a;o.b=d.b;o.width=d.w}else if(['a','b','width'].includes(prop)){brushPrefs[o.style]={...(brushPrefs[o.style]||{}),[prop==='width'?'w':prop]:val}}}
  o[prop]=val; if(o.type==='text') delete o.bb; render();
}
const insp=$('#insp');
insp.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='p-size'){return}
  if(t.id==='p-snap'){doc.snap=t.checked;render();commit();return}
  const prop=t.dataset.prop; if(!prop) return;
  let v=t.dataset.bool!==undefined?t.checked:t.dataset.num!==undefined?parseFloat(t.value):t.value;
  if(t.dataset.num!==undefined&&isNaN(v)) return;
  if(prop==='size') v=Math.max(4,v);
  if((prop==='w'||prop==='h')) v=Math.max(4,v);
  setProp(prop,v);
  const out=t.parentElement.querySelector('output'); if(out) out.textContent=prop==='op'?Math.round(v*100)+'%':(prop==='sw'||prop==='r'||prop==='width')?v+' px':v;
});
insp.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='p-size'){const [w,h]=t.value.split('x').map(Number);if(w&&h){doc.w=w;doc.h=h;commit();fit();renderInspector()}return}
  if(t.dataset.prop||t.id==='p-snap'){commit();if(t.type==='color'||t.tagName==='SELECT'){renderInspector();render()}}
});
insp.addEventListener('click',e=>{
  const s=e.target.closest('[data-swatch]'); if(s){setProp(s.dataset.swatch,s.dataset.color);commit();renderInspector();return}
  const g=e.target.closest('[data-seg]'); if(g){
    if(g.dataset.seg==='bg'){doc.bg=g.dataset.val;render();commit();renderInspector();return}
    let v=g.dataset.val; if(g.dataset.seg==='weight') v=+v; setProp(g.dataset.seg,v);commit();renderInspector();return}
  const a=e.target.closest('[data-act]'); if(!a) return; const o=get(sel);
  switch(a.dataset.act){
    case 'dup':dup();break; case 'del':del();break;
    case 'front':case 'back':case 'fwd':case 'bwd':arrange(a.dataset.act);break;
    case 'resetcol':{const d=iconDef(o.icon);if(d){o.a=d.a;o.b=d.b}}commit();render();renderInspector();break;
    case 'reverse':[o.x1,o.y1,o.x2,o.y2]=[o.x2,o.y2,o.x1,o.y1];o.curve=-(o.curve||0);commit();render();break;
  }
});

/* ---------- images & files ---------- */
function placeImage(file,p){
  if(file.size>6e6){toast('That image is over 6 MB. Use a smaller export of it.');return}
  const r=new FileReader(); r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,320/Math.max(im.width,im.height));const w=f(im.width*s),h=f(im.height*s);const c=p||{x:doc.w/2,y:doc.h/2};addItem({id:uid(),type:'image',href:r.result,x:f(c.x-w/2),y:f(c.y-h/2),w,h,rot:0,flip:false,lock:true,op:1})};im.onerror=()=>toast('That file could not be read as an image.');im.src=r.result};r.readAsDataURL(file);
}
$('#addimg').onclick=()=>$('#imgfile').click();
$('#imgfile').onchange=e=>{const fl=e.target.files[0];if(fl)placeImage(fl);e.target.value=''};
$('#jsonfile').onchange=e=>{const fl=e.target.files[0];e.target.value='';if(!fl)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.items)||!d.w||!d.h)throw 0;doc=d;sel=null;buildLib();commit();fit();renderInspector();toast('Opened '+fl.name)}catch(_){toast('That file is not an O2 Figure Studio project.')}};r.readAsText(fl)};

/* ---------- export ---------- */
const dlP=(window.claude&&window.claude.use)?window.claude.use('downloads').catch(()=>null):Promise.resolve(null);
function figureSVG(){
  const tr=doc.bg==='transparent';
  return `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${doc.w}" height="${doc.h}" viewBox="0 0 ${doc.w} ${doc.h}">${tr?'':`<rect width="${doc.w}" height="${doc.h}" fill="${doc.bg}"/>`}${doc.items.map(o=>renderItem(o,true)).join('')}</svg>`;
}
async function pngBlob(scale){
  const img=new Image(); img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(figureSVG());
  await img.decode();
  const c=document.createElement('canvas'); c.width=Math.round(doc.w*scale); c.height=Math.round(doc.h*scale);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('Canvas export failed')),'image/png'));
}
async function offer(filename,data,fallback){
  const dl=await dlP; if(!dl){fallback();return}
  try{await dl.save({filename,data});toast('Saved '+filename)}
  catch(err){const c=err&&err.code;if(c==='declined')toast('Export cancelled');else if(c==='rate_limited')toast('A save prompt is already open');else if(['unavailable','not_granted','capability_disabled','capability_removed'].includes(c))fallback();else toast('Export failed: '+(err&&err.message||'unknown error'))}
}
function showModal(html){$('#sheet').innerHTML=html;$('#modal').hidden=false}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'||e.target.closest('[data-close]'))$('#modal').hidden=true;const cp=e.target.closest('[data-copy]');if(cp){const ta=$('#sheet textarea');const done=()=>toast('Copied');navigator.clipboard?.writeText(ta.value).then(done,()=>{ta.select()})||ta.select()}});
function textFallback(title,text,note){showModal(`<h3>${title}</h3><p class="note">${note}</p><textarea readonly>${esc(text)}</textarea><div class="btnrow"><button class="btn" data-copy>Copy</button><button class="btn" data-close>Close</button></div>`)}
function fname(ext){const t=doc.items.find(o=>o.type==='text'&&o.size>=22);const base=(t?t.text.split('\n')[0]:'figure').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,48)||'figure';return base+'.'+ext}
async function doExport(kind){
  $('#exportpop').hidden=true; sel=null; render(); renderInspector();
  if(kind==='svg'){const s=figureSVG();offer(fname('svg'),s,()=>textFallback('SVG code','' + s,'Copy this into a file named figure.svg, or paste it into Illustrator or Inkscape.'));return}
  try{const sc=+$('#pngscale').value;const b=await pngBlob(sc);offer(fname('png'),b,()=>{const u=URL.createObjectURL(b);showModal(`<h3>PNG ready · ${doc.w*sc} × ${doc.h*sc} px</h3><p class="note">Right-click or long-press the image to save it.</p><img src="${u}" alt="Exported figure"><div class="btnrow"><button class="btn" data-close>Close</button></div>`)})}
  catch(err){toast('PNG export failed. Try SVG instead.')}
}
document.querySelectorAll('[data-export]').forEach(b=>b.onclick=()=>doExport(b.dataset.export));
const updPx=()=>{const s=+$('#pngscale').value;$('#pngpx').textContent=`${doc.w*s} × ${doc.h*s} px`};
$('#pngscale').onchange=updPx;

/* ---------- toolbar ---------- */
const pops=['exportpop','filepop','newpop'];
function togglePop(id){pops.forEach(p=>{if(p!==id)$('#'+p).hidden=true});$('#'+id).hidden=!$('#'+id).hidden;if(id==='exportpop')updPx()}
$('#exportbtn').onclick=e=>{e.stopPropagation();togglePop('exportpop')};
$('#filebtn').onclick=e=>{e.stopPropagation();togglePop('filepop')};
$('#newbtn').onclick=e=>{e.stopPropagation();togglePop('newpop')};
document.addEventListener('click',e=>{if(!e.target.closest('.pop')&&!e.target.closest('#exportbtn,#filebtn,#newbtn'))pops.forEach(p=>$('#'+p).hidden=true)});
$('#newyes').onclick=()=>{doc={w:doc.w,h:doc.h,bg:doc.bg,snap:doc.snap,custom:doc.custom,items:[]};sel=null;commit();render();renderInspector();$('#newpop').hidden=true;toast('Canvas cleared · Ctrl+Z to undo')};
$('#newno').onclick=()=>$('#newpop').hidden=true;
$('#savejson').onclick=()=>{$('#filepop').hidden=true;const s=JSON.stringify(doc);offer(fname('json'),s,()=>textFallback('Project file',s,'Copy this into a .json file to reopen it later with Open project.'))};
$('#openjson').onclick=()=>{$('#filepop').hidden=true;$('#jsonfile').click()};
$('#loadsample').onclick=()=>{$('#filepop').hidden=true;doc=Object.assign(sample(),{custom:doc.custom});sel=null;buildLib();commit();fit();renderInspector()};
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
$('#undo').onclick=undo; $('#redo').onclick=redo;
$('#zin').onclick=()=>setZoom(zoom*1.25); $('#zout').onclick=()=>setZoom(zoom/1.25); $('#zfit').onclick=fit;


/* ---------- generate with AI ---------- */
const sampleP=(window.claude&&window.claude.use)?window.claude.use('sample').catch(()=>null):Promise.resolve(null);
let sampleFn=null; sampleP.then(s=>{sampleFn=s;$('#genbox').hidden=!s});
const hexOr=(v,d)=>/^#[0-9a-f]{6}$/i.test(v)?v:d;
const OK_TAGS=new Set(['g','path','circle','ellipse','rect','line','polyline','polygon']);
const OK_ATTR=new Set(['d','cx','cy','r','rx','ry','x','y','x1','y1','x2','y2','width','height','points','fill','stroke','stroke-width','stroke-linecap','stroke-linejoin','stroke-dasharray','stroke-miterlimit','opacity','fill-opacity','stroke-opacity','fill-rule','transform']);
const COLOR_RE=/^(none|MAIN|MAIN_DARK|MAIN_LIGHT|DETAIL|DETAIL_DARK|DETAIL_LIGHT|WHITE|#[0-9a-fA-F]{3,8})$/;
function sanitizeIcon(markup){
  if(typeof markup!=='string'||!markup.trim()) return '';
  const body=markup.replace(/<\?xml[^>]*>/g,'').replace(/<\/?svg[^>]*>/g,'');
  const d=new DOMParser().parseFromString(`<svg xmlns="http://www.w3.org/2000/svg">${body}</svg>`,'image/svg+xml');
  if(d.querySelector('parsererror')) return '';
  const walk=el=>{const t=el.localName;if(!OK_TAGS.has(t))return '';let s='<'+t;
    for(const at of el.attributes){const n=at.name,v=at.value.trim();if(!OK_ATTR.has(n)||/[<>"&]/.test(v))continue;
      if((n==='fill'||n==='stroke')&&!COLOR_RE.test(v))continue;
      if(n==='transform'&&!/^[a-zA-Z0-9\s(),.\-]+$/.test(v))continue;
      if(n==='d'&&!/^[MmLlHhVvCcSsQqTtAaZz0-9\s,.\-eE]+$/.test(v))continue;
      s+=` ${n}="${v}"`}
    const kids=[...el.children].map(walk).join('');return s+(kids?`>${kids}</${t}>`:'/>')};
  return [...d.documentElement.children].map(walk).join('').slice(0,80000);
}
const SVG_RULES=`Inner SVG markup for viewBox 0 0 100 100 (fill most of the box, ~4 px margin). Only path, circle, ellipse, rect, line, polyline, polygon and g elements. No text, gradients, defs, style or class attributes. For fill and stroke use only these words: MAIN, MAIN_DARK, MAIN_LIGHT, DETAIL, DETAIL_DARK, DETAIL_LIGHT, WHITE, none. Flat BioRender-like style: soft MAIN_LIGHT or MAIN fills, MAIN_DARK outlines with stroke-width 2-3 and round joins, DETAIL for the key internal feature, one WHITE highlight ellipse at opacity 0.5.`;
function iconPrompt(desc){return `Draw one scientific icon: """${desc}"""
Reply with only JSON: {"name":"Short name, max 3 words","main":"#hex","detail":"#hex","svg":"..."}
svg: ${SVG_RULES} Make it recognizable to an expert: correct proportions and the parts they expect to see. Use 15-60 elements.`}


let aiCtl=null;
const setStatus=(m,err)=>{const s=$('#genstatus');s.textContent=m;s.classList.toggle('err',!!err)};
function aiErr(e){const c=e&&e.code;return c==='cancelled'?'Stopped.':c==='not_granted'?'Claude was not allowed for this page. Reload to be asked again.':c==='rate_limited'?'Too many requests. Wait a moment and try again.':c==='invalid_json'?'That icon could not be drawn. Try again or describe it differently.':(e&&e.message)||'Generation failed. Try again.'}
async function genIcon(){
  if(aiCtl){aiCtl.abort();return}
  const desc=$('#genin').value.trim(); if(!desc){setStatus('Type what the icon should show.',true);$('#genin').focus();return}
  if(!sampleFn){setStatus('Generation is not available here.',true);return}
  aiCtl=new AbortController(); const btn=$('#gengo'); btn.textContent='Stop'; setStatus('Drawing “'+desc+'”…');
  try{
    const r=await sampleFn.json(iconPrompt(desc),{signal:aiCtl.signal,modelTier:'default'});
    const svgM=sanitizeIcon(r&&r.svg); if(!svgM) throw {code:'invalid_json'};
    const k='c_'+uid(); doc.custom={...(doc.custom||{}),[k]:{name:String(r.name||desc).slice(0,40),svg:svgM,a:hexOr(r.main,'#e8618c'),b:hexOr(r.detail,'#4b3f8f')}};
    $('#genin').value=''; $('#search').value=''; buildLib(); addFromLib(k); setStatus('Added to the canvas and to Generated below.');
  }catch(e){setStatus(aiErr(e),e&&e.code!=='cancelled')}
  finally{aiCtl=null;btn.textContent='Generate'}
}
$('#gengo').onclick=genIcon;
$('#genin').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(!aiCtl)genIcon()}});

let tt; function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}

/* ---------- boot ---------- */
try{const s=localStorage.getItem(KEY);if(s){const d=JSON.parse(s);if(Array.isArray(d.items)&&d.w)doc=d}}catch(e){}
if(!doc) doc=sample();
buildLib(); commit(); render(); renderInspector();
requestAnimationFrame(()=>{fit();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{render()})});
})();
</script>

</body></html>
